<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scout Studio</title>
    <link rel="icon" href="/scout-glyph-ink.svg" type="image/svg+xml" />
    <!-- Critical boot styles stay inline so the canvas can paint without the app bundle. -->
    <style>
      [data-scout-boot="canvas"] {
        --boot-bg: #0c0d10;
        --boot-ink: #eceef2;
        --boot-accent: #e8a33d;
        --boot-muted: #a9adb6;
        --boot-line: color-mix(in srgb, var(--boot-ink) 12%, transparent);
        --boot-fill: color-mix(in srgb, var(--boot-ink) 6%, var(--boot-bg));
        min-height: 100vh;
        background: var(--boot-bg);
        color: var(--boot-ink);
        font: 400 13px/1.45 system-ui, sans-serif;
      }
      @media (prefers-color-scheme: light) {
        [data-scout-boot="canvas"] {
          --boot-bg: #fbfbfa;
          --boot-ink: #18191c;
          --boot-accent: #b86e00;
          --boot-muted: #575b65;
        }
      }
      body { margin: 0; }
      .scout-boot-bar {
        box-sizing: border-box;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-inline: 16px;
        border-bottom: 1px solid var(--boot-line);
      }
      .scout-boot-brand { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 500; }
      .scout-boot-mark {
        width: 16px;
        height: 18px;
        flex: none;
      }
      .scout-boot-status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border: 1px solid var(--boot-line);
        border-radius: 999px;
        color: var(--boot-muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .scout-boot-status::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--boot-accent);
      }
      .scout-boot-rail {
        box-sizing: border-box;
        max-width: 1228px;
        margin-inline: auto;
        padding: 32px 24px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }
      .scout-boot-card {
        display: grid;
        gap: 8px;
        padding: 8px;
        border: 1px solid var(--boot-line);
        border-radius: 8px;
      }
      .scout-boot-card i { height: 8px; width: 48%; border-radius: 4px; background: var(--boot-fill); }
      .scout-boot-card i:first-child { width: 100%; height: auto; aspect-ratio: 16 / 10; }
      .scout-boot-card i:last-child { width: 29%; }
      @media (max-width: 540px) {
        .scout-boot-rail { grid-template-columns: minmax(0, 1fr); }
        .scout-boot-card:nth-child(n+2) { display: none; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .scout-boot-card i { animation: scout-boot-breathe 1.8s ease-in-out infinite alternate; }
        @keyframes scout-boot-breathe { to { opacity: .55; } }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div data-scout-boot="canvas">
        <header class="scout-boot-bar">
          <span class="scout-boot-brand"><svg class="scout-boot-mark" aria-hidden="true" viewBox="5 -4 214 244"><path d="M103.01 13.21 Q112 8 120.99 13.21 L198.01 57.79 Q207 63 207 73.39 L207 162.61 Q207 173 198.01 178.21 L120.99 222.79 Q112 228 103.01 222.79 L25.99 178.21 Q17 173 17 162.61 L17 73.39 Q17 63 25.99 57.79 Z" fill="none" stroke="currentColor" stroke-width="24" stroke-linejoin="round"/><path d="M112 70 154 94v48l-42 24-42-24V94Z" fill="currentColor"/></svg>Scout Studio</span>
          <span class="scout-boot-status" role="status">Looking for Scout…</span>
        </header>
        <main class="scout-boot-rail" aria-hidden="true">
          <div class="scout-boot-card"><i></i><i></i><i></i></div>
          <div class="scout-boot-card"><i></i><i></i><i></i></div>
          <div class="scout-boot-card"><i></i><i></i><i></i></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
